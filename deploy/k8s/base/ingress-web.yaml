apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: china-study-free-web
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - studyfree.xyz
      secretName: studyfree-xyz-tls
  rules:
    - host: studyfree.xyz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: china-study-free
                port:
                  name: http
---
# 公网 host 上的 /api/admin 也必须受内网白名单保护。
# Traefik 会把更长的 PathPrefix 路由优先匹配。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: china-study-free-web-admin
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: china-study-free-china-study-free-admin-allow@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - studyfree.xyz
      secretName: studyfree-xyz-tls
  rules:
    - host: studyfree.xyz
      http:
        paths:
          - path: /api/admin
            pathType: Prefix
            backend:
              service:
                name: china-study-free
                port:
                  name: http
