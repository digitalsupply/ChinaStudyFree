# 一次性把 assets 镜像里的资源复制到 PVC。
#
# 使用前提：
#   1. PVC china-study-free-assets 已创建（Argo 同步 base/assets-pvc.yaml）。
#   2. 已构建并推送匹配的资源镜像：
#        docker build -f docker/assets.Dockerfile \
#          -t 192.168.67.202:8443/china-study-free/assets:v1.4.0 \
#          apps/web/public
#        docker push 192.168.67.202:8443/china-study-free/assets:v1.4.0
#   3. 手动 apply：
#        kubectl --kubeconfig /root/.kube/deeptutor-config -n china-study-free \
#          apply -f deploy/k8s/base/assets-loader-job.yaml
#
# 该 Job 作为 Argo CD PostSync hook 运行；marker 存在时直接退出。
# 资源更新时修改镜像 tag 和 marker，提交 GitOps 后 Argo 会自动重跑。
apiVersion: batch/v1
kind: Job
metadata:
  name: china-study-free-assets-loader
  labels:
    app: china-study-free-assets-loader
  annotations:
    # Argo CD 每次同步后运行一次；marker 存在时立即退出，不会重复复制。
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 3600
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels:
        app: china-study-free-assets-loader
    spec:
      restartPolicy: OnFailure
      imagePullSecrets:
        - name: harbor-auth
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: loader
          image: 192.168.67.202:8443/china-study-free/assets:v1.4.0
          imagePullPolicy: IfNotPresent
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              MARKER=/assets/.assets-v1.4.0
              if [ -f "$MARKER" ]; then
                echo "assets already loaded: $MARKER"
                exit 0
              fi
              mkdir -p /assets
              for d in story-images textbook-pages audio; do
                if [ -d "/src/$d" ]; then
                  echo "copying $d ..."
                  mkdir -p "/assets/$d"
                  tar -C "/src/$d" -cf - . | tar -C "/assets/$d" -xf -
                fi
              done
              touch "$MARKER"
              echo "assets loaded"
          volumeMounts:
            - name: assets
              mountPath: /assets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: assets
          persistentVolumeClaim:
            claimName: china-study-free-assets
