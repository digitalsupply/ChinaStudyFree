apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: china-study-free
spec:
  podSelector:
    matchLabels:
      app: china-study-free
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 只允许 Traefik 访问应用端口。
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: traefik
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: TCP
          port: 8787
  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    # LLM / TTS / Gemini / EdgeTTS 等外部 HTTPS
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
