apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: china-study-free-admin
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.middlewares: china-study-free-china-study-free-admin-allow@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - admin.studyfree.xyz
      secretName: studyfree-xyz-tls
  rules:
    - host: admin.studyfree.xyz
      http:
        paths:
          - path: /api/admin
            pathType: Prefix
            backend:
              service:
                name: china-study-free
                port:
                  name: http
